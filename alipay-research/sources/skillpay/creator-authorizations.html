      const user = root.querySelector('[data-nav-user]');

      if (user instanceof HTMLElement) user.hidden = !isLoggedIn;

      const revealAvatar = () => {
        avatar.hidden = false;
        if (initial instanceof HTMLElement) initial.hidden = true;
      };
      avatar.src = avatarUrl;
      if (avatar.complete && avatar.naturalWidth > 0) revealAvatar();
      else avatar.addEventListener('load', revealAvatar, { once: true });
    } catch {
      // Keep both account variants hidden until the live status check completes.
    }
  })();
